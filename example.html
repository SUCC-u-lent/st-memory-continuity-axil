<!-- You might want to add additional HTML elements to ST. 
    It's good practice to separate it out from your code -->
<div class="mca-extension-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Memory Continuity</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <div class="alignitemsflexstart flex-container wide100p">
                <input id="mca_url" type="text" class="flex1 heightFitContent text_pole widthNatural" data-i18n="[placeholder]Auxil API URL" placeholder="Auxil API URL">
                <div class="extensions_url_block">
                    <div id="mca_connect" class="menu_button interactable" data-i18n="Connect" tabindex="0" role="button">Connect</div>
                </div>
                <div class="extensions_url_block">
                    <div id="mca_send_sample" class="menu_button interactable" data-i18n="Send Sample" tabindex="0" role="button">Send Sample</div>
                </div>
            </div>
            <hr class="sysHR" />
        </div>
    </div>
</div>
